<!-- File: index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Code Typing Practice</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #1e1e2f;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }
  h1 { margin-bottom: 10px; }

  #setupArea {
    background: #2a2a3d;
    padding: 20px 30px;
    border-radius: 8px;
    margin-bottom: 20px;
    max-width: 700px;
  }
  .lang-checkboxes {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 14px 0;
  }
  .lang-checkboxes label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  button {
    padding: 10px 20px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    background: #4caf50;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #43a047; }
  button:disabled {
    background: #555;
    cursor: not-allowed;
  }

  #progress {
    font-size: 16px;
    margin-bottom: 10px;
    color: #aaa;
  }
  #stats {
    display: flex;
    gap: 30px;
    margin: 10px 0 20px;
    font-size: 16px;
  }
  #target {
    font-family: "Consolas", "Menlo", "Courier New", monospace;
    font-size: 20px;
    line-height: 1.9;
    padding: 24px;
    background: #2a2a3d;
    border-radius: 8px;
    max-width: 800px;
    min-height: 160px;
    white-space: pre-wrap;
    display: none;
  }
  .correct { color: #4caf50; }
  .wrong {
    color: #f44336;
    background: rgba(244, 67, 54, 0.25);
    border-radius: 3px;
  }
  .current {
    background: #565672;
    border-radius: 3px;
    outline: 2px solid #8888ff;
  }
  .remaining { color: #888; }
  .space-symbol, .newline-symbol, .tab-symbol {
    opacity: 0.7;
  }

  #imeInput {
    margin-top: 14px;
    padding: 10px;
    font-size: 16px;
    width: 300px;
    border-radius: 6px;
    border: none;
    display: none;
  }

  #questionResult, #finalResult {
    margin-top: 20px;
    font-size: 17px;
    background: #2a2a3d;
    padding: 20px;
    border-radius: 8px;
    display: none;
    max-width: 800px;
    width: 100%;
  }
  #finalResult table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  #finalResult th, #finalResult td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid #444;
  }
  .legend {
    font-size: 13px;
    color: #999;
    margin-top: 10px;
  }
  #hiddenInput {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>Code Typing Practice</h1>

<div id="setupArea">
  <div>練習したい言語を選択してください(複数選択可)</div>
  <div class="lang-checkboxes">
    <label><input type="checkbox" value="japanese"> 日本語</label>
    <label><input type="checkbox" value="english"> English</label>
    <label><input type="checkbox" value="python" checked> Python</label>
    <label><input type="checkbox" value="javascript" checked> JavaScript</label>
    <label><input type="checkbox" value="c"> C</label>
    <label><input type="checkbox" value="go"> Go</label>
    <label><input type="checkbox" value="html"> HTML</label>
    <label><input type="checkbox" value="java"> Java</label>
    <label><input type="checkbox" value="php"> PHP</label>
  </div>
  <button id="startBtn">Start (10 Questions)</button>
</div>

<div id="progress"></div>

<div id="stats">
  <div>Time: <span id="time">0.0</span>s</div>
  <div>WPM: <span id="wpm">0</span></div>
  <div>Accuracy: <span id="accuracy">100</span>%</div>
  <div>Miss: <span id="missCount">0</span></div>
</div>

<div id="target"></div>
<input type="text" id="imeInput" placeholder="日本語はここに入力してください">
<div class="legend">␣ = スペース / ↵ = Enter / → = Tab</div>

<input type="text" id="hiddenInput" autofocus>

<div id="questionResult">
  <h3></h3>
  <p>Time: <span id="qResTime"></span>s / WPM: <span id="qResWpm"></span> / Accuracy: <span id="qResAcc"></span>%</p>
  <button id="nextBtn">Next Question</button>
</div>

<div id="finalResult">
  <h2>Final Result (10 Questions)</h2>
  <p>Average WPM: <span id="avgWpm"></span></p>
  <p>Average Accuracy: <span id="avgAcc"></span>%</p>
  <h3>Miss Key Ranking</h3>
  <table>
    <thead><tr><th>#</th><th>Key</th><th>Count</th></tr></thead>
    <tbody id="missRankBody"></tbody>
  </table>
  <button id="restartBtn">Restart</button>
</div>

<script>
const snippetSets = {
  japanese: [
    "わたしはにほんごをべんきょうしています",
    "きょうはとてもいいてんきですね",
    "ぷろぐらみんぐのれんしゅうをがんばります",
    "たいぴんぐがはやくなりたいです",
    "あしたはやくおきてはしります"
  ],
  english: [
    "the quick brown fox jumps over the lazy dog",
    "practice makes perfect every single day",
    "consistency beats intensity in the long run",
    "typing fast is a skill that improves with practice",
    "never give up on your dreams and goals"
  ],
  python: [
    "def fibonacci(n):\n    if n <= 1:\n        return n\n    return fibonacci(n - 1) + fibonacci(n - 2)",
    "for i in range(1, 21):\n    if i % 15 == 0:\n        print(\"FizzBuzz\")\n    elif i % 3 == 0:\n        print(\"Fizz\")\n    else:\n        print(i)",
    "class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return f\"{self.name} makes a sound\""
  ],
  javascript: [
    "function greet(name) {\n    console.log(`Hello, ${name}!`);\n}",
    "const numbers = [1, 2, 3, 4, 5];\nconst evens = numbers.filter(n => n % 2 === 0);\nconsole.log(evens);",
    "async function getData(url) {\n    const res = await fetch(url);\n    const data = await res.json();\n    return data;\n}"
  ],
  c: [
    "#include <stdio.h>\n\nint main() {\n    printf(\"Hello, World!\\n\");\n    return 0;\n}",
    "#include <stdio.h>\n\nint main() {\n    for (int i = 0; i < 10; i++) {\n        printf(\"%d\\n\", i);\n    }\n    return 0;\n}"
  ],
  go: [
    "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"Hello, World!\")\n}",
    "func add(a int, b int) int {\n\treturn a + b\n}",
    "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := 0; i < 5; i++ {\n\t\tfmt.Println(i)\n\t}\n}"
  ],
  html: [
    "<div class=\"container\">\n    <p>Hello World</p>\n</div>",
    "<form action=\"/submit\" method=\"post\">\n    <input type=\"text\" name=\"username\">\n    <button type=\"submit\">Send</button>\n</form>"
  ],
  java: [
    "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n    }\n}"
  ],
  php: [
    "<?php\nfunction add($a, $b) {\n    return $a + $b;\n}\n?>",
    "<?php\n$name = \"World\";\necho \"Hello, \" . $name . \"!\";\n?>",
    "<?php\nforeach ($items as $item) {\n    echo $item . PHP_EOL;\n}\n?>"
  ]
};

const TOTAL_QUESTIONS = 10;

let selectedLangs = [];
let questionsData = [];
let currentIndex = 0;
let questionResults = [];
let allMissKeyMap = {};

let targetText = "";
let currentLang = "";
let typedIndex = 0;
let startTime = null;
let timerInterval = null;
let missCount = 0;
let totalTyped = 0;
let missKeyMap = {};
let finished = false;

const setupArea = document.getElementById("setupArea");
const startBtn = document.getElementById("startBtn");
const progressEl = document.getElementById("progress");
const targetEl = document.getElementById("target");
const hiddenInput = document.getElementById("hiddenInput");
const imeInput = document.getElementById("imeInput");
const timeEl = document.getElementById("time");
const wpmEl = document.getElementById("wpm");
const accuracyEl = document.getElementById("accuracy");
const missCountEl = document.getElementById("missCount");
const questionResultEl = document.getElementById("questionResult");
const nextBtn = document.getElementById("nextBtn");
const finalResultEl = document.getElementById("finalResult");
const restartBtn = document.getElementById("restartBtn");

function isJapaneseMode() {
  return currentLang === "japanese";
}

function getSelectedLangs() {
  return Array.from(document.querySelectorAll('.lang-checkboxes input[type=checkbox]:checked'))
    .map(cb => cb.value);
}

function pickSnippet(lang) {
  const pool = snippetSets[lang];
  return pool[Math.floor(Math.random() * pool.length)];
}

function buildQuestionSet() {
  const set = [];
  for (let i = 0; i < TOTAL_QUESTIONS; i++) {
    const lang = selectedLangs[Math.floor(Math.random() * selectedLangs.length)];
    set.push({ lang, text: pickSnippet(lang) });
  }
  return set;
}

function escapeHtml(ch) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" };
  return map[ch] || ch;
}

function keyLabel(ch) {
  if (ch === " ") return "Space";
  if (ch === "\n") return "Enter";
  if (ch === "\t") return "Tab";
  return ch;
}

function renderTarget() {
  let html = "";
  for (let i = 0; i < targetText.length; i++) {
    const ch = targetText[i];
    let displayChar;
    let extraClass = "";

    if (ch === " ") {
      displayChar = "&#9251;";
      extraClass = "space-symbol";
    } else if (ch === "\n") {
      displayChar = "&#8626;";
      extraClass = "newline-symbol";
    } else if (ch === "\t") {
      displayChar = "&#8594;";
      extraClass = "tab-symbol";
    } else {
      displayChar = escapeHtml(ch);
    }

    let stateClass;
    if (i < typedIndex) stateClass = "correct";
    else if (i === typedIndex) stateClass = "current";
    else stateClass = "remaining";

    html += `<span class="${stateClass} ${extraClass}">${displayChar}</span>`;
    if (ch === "\n") html += "<br>";
  }
  targetEl.innerHTML = html;
}

function resetPerQuestionState() {
  typedIndex = 0;
  startTime = null;
  missCount = 0;
  totalTyped = 0;
  missKeyMap = {};
  finished = false;
  clearInterval(timerInterval);
  timeEl.textContent = "0.0";
  wpmEl.textContent = "0";
  accuracyEl.textContent = "100";
  missCountEl.textContent = "0";
}

function startQuestion() {
  const q = questionsData[currentIndex];
  targetText = q.text;
  currentLang = q.lang;
  resetPerQuestionState();
  renderTarget();

  progressEl.textContent = `Question ${currentIndex + 1} / ${TOTAL_QUESTIONS}  (${currentLang})`;
  questionResultEl.style.display = "none";
  targetEl.style.display = "block";

  if (isJapaneseMode()) {
    imeInput.style.display = "inline-block";
    imeInput.value = "";
    imeInput.focus();
  } else {
    imeInput.style.display = "none";
    hiddenInput.value = "";
    hiddenInput.focus();
  }
}

function startTimerIfNeeded() {
  if (startTime === null) {
    startTime = Date.now();
    timerInterval = setInterval(updateStats, 100);
  }
}

function updateStats() {
  const elapsed = (Date.now() - startTime) / 1000;
  timeEl.textContent = elapsed.toFixed(1);
  const minutes = elapsed / 60;
  const wpm = minutes > 0 ? Math.round((typedIndex / 5) / minutes) : 0;
  wpmEl.textContent = wpm;
  const accuracy = totalTyped > 0
    ? Math.max(0, Math.round(((totalTyped - missCount) / totalTyped) * 100))
    : 100;
  accuracyEl.textContent = accuracy;
  missCountEl.textContent = missCount;
}

function handleTypedChar(typedChar) {
  if (finished) return;
  startTimerIfNeeded();
  totalTyped++;
  const expected = targetText[typedIndex];

  if (typedChar === expected) {
    typedIndex++;
  } else {
    missCount++;
    const label = keyLabel(typedChar);
    missKeyMap[label] = (missKeyMap[label] || 0) + 1;
    allMissKeyMap[label] = (allMissKeyMap[label] || 0) + 1;
  }

  renderTarget();

  if (typedIndex >= targetText.length) {
    finishQuestion();
  }
}

function finishQuestion() {
  finished = true;
  clearInterval(timerInterval);
  const elapsed = (Date.now() - startTime) / 1000;
  const minutes = elapsed / 60;
  const wpm = minutes > 0 ? Math.round((targetText.length / 5) / minutes) : 0;
  const accuracy = totalTyped > 0
    ? Math.max(0, Math.round(((totalTyped - missCount) / totalTyped) * 100))
    : 100;

  questionResults.push({ wpm, accuracy });

  document.querySelector("#questionResult h3").textContent =
    `Question ${currentIndex + 1} Result`;
  document.getElementById("qResTime").textContent = elapsed.toFixed(1);
  document.getElementById("qResWpm").textContent = wpm;
  document.getElementById("qResAcc").textContent = accuracy;

  targetEl.style.display = "none";
  imeInput.style.display = "none";
  questionResultEl.style.display = "block";

  nextBtn.textContent = currentIndex + 1 >= TOTAL_QUESTIONS
    ? "Show Final Result"
    : "Next Question";
}

function showFinalResult() {
  const avgWpm = Math.round(
    questionResults.reduce((sum, r) => sum + r.wpm, 0) / questionResults.length
  );
  const avgAcc = Math.round(
    questionResults.reduce((sum, r) => sum + r.accuracy, 0) / questionResults.length
  );

  document.getElementById("avgWpm").textContent = avgWpm;
  document.getElementById("avgAcc").textContent = avgAcc;

  const ranking = Object.entries(allMissKeyMap)
    .sort((a, b) => b[1] - a[1]);

  const tbody = document.getElementById("missRankBody");
  tbody.innerHTML = "";
  if (ranking.length === 0) {
    tbody.innerHTML = "<tr><td colspan='3'>No misses. Great job!</td></tr>";
  } else {
    ranking.forEach(([key, count], i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${i + 1}</td><td>${key}</td><td>${count}</td>`;
      tbody.appendChild(tr);
    });
  }

  progressEl.textContent = "";
  questionResultEl.style.display = "none";
  finalResultEl.style.display = "block";
}

hiddenInput.addEventListener("keydown", (e) => {
  if (isJapaneseMode()) return;
  if (finished) return;

  let typedChar = null;
  if (e.key === "Enter") typedChar = "\n";
  else if (e.key === "Tab") typedChar = "\t";
  else if (e.key.length === 1) typedChar = e.key;
  else return;

  e.preventDefault();
  handleTypedChar(typedChar);
});

imeInput.addEventListener("compositionend", (e) => {
  if (!isJapaneseMode() || finished) return;
  const value = e.target.value;
  for (const ch of value) {
    if (finished) break;
    handleTypedChar(ch);
  }
  e.target.value = "";
});

imeInput.addEventListener("input", (e) => {
  if (!isJapaneseMode() || finished) return;
  if (e.isComposing) return;
  const value = e.target.value;
  if (value) {
    for (const ch of value) {
      if (finished) break;
      handleTypedChar(ch);
    }
    e.target.value = "";
  }
});

document.body.addEventListener("click", () => {
  if (finished) return;
  if (isJapaneseMode()) imeInput.focus();
  else hiddenInput.focus();
});

startBtn.addEventListener("click", () => {
  selectedLangs = getSelectedLangs();
  if (selectedLangs.length === 0) {
    alert("少なくとも1つの言語を選択してください");
    return;
  }
  questionsData = buildQuestionSet();
  currentIndex = 0;
  questionResults = [];
  allMissKeyMap = {};

  setupArea.style.display = "none";
  finalResultEl.style.display = "none";

  startQuestion();
});

nextBtn.addEventListener("click", () => {
  currentIndex++;
  if (currentIndex >= TOTAL_QUESTIONS) {
    showFinalResult();
  } else {
    startQuestion();
  }
});

restartBtn.addEventListener("click", () => {
  finalResultEl.style.display = "none";
  setupArea.style.display = "block";
});
</script>

</body>
</html>
